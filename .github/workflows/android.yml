name: Android CI (Rust)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Restore persistent debug keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > debug.keystore
            echo "debug.keystore dipulihkan dari secret — build memakai tanda tangan persisten"
          else
            echo "DEBUG_KEYSTORE_BASE64 tidak ada — build rilis tanpa signing akan gagal"
            exit 1
          fi

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install cargo-apk
        run: cargo install cargo-apk

      - name: Build release APK
        env:
          CARGO_APK_RELEASE_KEYSTORE: ${{ github.workspace }}/debug.keystore
          CARGO_APK_RELEASE_KEYSTORE_PASSWORD: android
        run: |
          export ANDROID_NDK_ROOT="$ANDROID_HOME/ndk/26.1.10909125"
          cargo --version
          rustc --version
          cargo apk build --lib --release

      - name: Verify APK
        run: |
          APK=$(ls target/release/apk/*.apk | head -n 1)
          echo "APK=$APK" >> "$GITHUB_ENV"
          ls -l "$APK"
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "$APK" | grep -E "package:|application-label"
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs "$APK"

      # TIDAK ada upload-artifact: kuota storage Actions akun terbatas.
      # APK disalurkan lewat GitHub Release di step berikut.
      - name: Create or update GitHub Release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v2.0"
          cp "$APK" "HozinKuis-2.0.apk"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "HozinKuis-2.0.apk" --clobber
          else
            gh release create "$TAG" "HozinKuis-2.0.apk" --title "Hozin Kuis 2.0" --notes "Game kuis Android native, ditulis PENUH dalam Rust (cargo-apk + android-activity + egui). 100% OFFLINE: bank 120 soal Trivia Bahasa Indonesia + data dan sprite 151 Pokemon Gen 1 dibundel di aplikasi. Mode Trivia (6 kategori, 3 tingkat) dan Tebak Pokemon (siluet di atas latar terang). 10 soal/ronde, timer 30 detik per soal, skor + streak, skor terbaik tersimpan lokal. Tanpa iklan, tanpa IAP, tanpa login, tanpa internet."
          fi
