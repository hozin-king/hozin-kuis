name: Android CI (Rust)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Restore persistent debug keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > debug.keystore
            echo "debug.keystore dipulihkan dari secret — build memakai tanda tangan persisten"
          else
            echo "DEBUG_KEYSTORE_BASE64 tidak ada — build rilis tanpa signing akan gagal"
            exit 1
          fi

      - name: Install Android SDK packages
        # TANPA android-actions/setup-android: action itu gagal di runner ini
        # (sdkmanager cmdline-tools 16 tidak lagi punya paket 'tools').
        # Runner ubuntu-latest sudah membawa Android SDK (ANDROID_HOME ter-set).
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install cargo-apk
        run: cargo install cargo-apk

      - name: Build release APK
        env:
          CARGO_APK_RELEASE_KEYSTORE: ${{ github.workspace }}/debug.keystore
          CARGO_APK_RELEASE_KEYSTORE_PASSWORD: android
        run: |
          export ANDROID_NDK_ROOT="$ANDROID_HOME/ndk/26.1.10909125"
          cargo --version
          rustc --version
          cargo apk build --lib --release

      - name: Verify APK
        run: |
          # cargo-apk menghasilkan 2 file: HozinKuis.apk (aligned+ditandatangani)
          # dan HozinKuis-unaligned.apk (mentah, TIDAK ditandatangani).
          # Urutan ls alfabetis menaruh yang unaligned lebih dulu ('-' < '.'),
          # jadi saring keluar file unaligned.
          APK=$(ls target/release/apk/*.apk | grep -v -- '-unaligned.apk' | head -n 1)
          echo "APK=$APK" >> "$GITHUB_ENV"
          ls -l "$APK"
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "$APK" | grep -E "package:|application:"
          # Ikon launcher WAJIB terisi (v2.3): badging 'application:' harus
          # membawa icon, dan manifest harus punya atribut android:icon.
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "$APK" | grep -q "icon=" || (echo "GAGAL: APK tidak punya ikon launcher" && exit 1)
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump xmltree "$APK" AndroidManifest.xml | grep -q "android:icon" || (echo "GAGAL: manifest tidak punya android:icon" && exit 1)
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs "$APK"

      # TIDAK ada upload-artifact: kuota storage Actions akun terbatas.
      # APK disalurkan lewat GitHub Release di step berikut.
      - name: Create or update GitHub Release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v2.4"
          cp "$APK" "HozinKuis-2.4.apk"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "HozinKuis-2.4.apk" --clobber
          else
            gh release create "$TAG" "HozinKuis-2.4.apk" --title "Hozin Kuis 2.4" --notes "v2.4 — poles layar trivia + tombol kembali ke menu utama: kartu soal lebih besar (30pt, min-height 110pt, garis aksen), tombol jawaban A-D 84px dengan tint gelap per huruf (A biru, B hijau, C emas, D ungu), timer terintegrasi rapi (bar 36px + teks 18pt di dalam bar — v2.3 teksnya menumpuk di atas bar), strip 5 maskot didorong ke dasar layar sehingga void ungu besar di bawah titik progres hilang, dan tombol '← Menu' di kiri atas layar trivia (juga di Tebak Pokemon — layar yang sama) untuk kembali ke menu utama kapan saja. Layar hasil ikut dipoles (font skor diperbesar + strip maskot di dasar). Fungsi tidak berubah: 10 soal/ronde, timer 30 detik, skor + streak, skor terbaik lokal. Game kuis Android native, ditulis PENUH dalam Rust (cargo-apk + android-activity + egui). 100% OFFLINE: bank 120 soal Trivia Bahasa Indonesia + data dan sprite 151 Pokemon Gen 1 dibundel di aplikasi. Tanpa iklan, tanpa IAP, tanpa login, tanpa internet."
          fi
