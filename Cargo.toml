[package]
name = "hozin-kuis"
version = "2.3.0"
edition = "2021"
description = "Hozin Kuis — game kuis offline (Trivia Bahasa Indonesia + Tebak Pokemon), ditulis penuh dalam Rust"
license = "MIT"

# cdylib: cargo-apk mengemas .so ini ke APK via android.app.NativeActivity.
[lib]
name = "hozin_kuis"
crate-type = ["cdylib"]

[dependencies]
egui = "0.33"
rand = "0.9"
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(target_os = "android")'.dependencies]
android-activity = "0.6"
eframe = { version = "0.33", default-features = false, features = ["glow", "android-native-activity", "default_fonts"] }
android_logger = "0.15"
log = "0.4"

[package.metadata.android]
apk_name = "HozinKuis"
package = "com.hozinking.kuis"
build_targets = ["aarch64-linux-android"]
# Ikon launcher: android_res/mipmap-*/ic_launcher.png (dihasilkan dari
# sprite Pikachu oleh tools/gen_icon.py) + icon di [application] di bawah.
# Field cargo-apk 0.10 adalah `resources` (bukan `res` — `res` milik fork
# cargo-quad-apk dan diabaikan diam-diam, yang membuat aapt gagal karena
# @mipmap/ic_launcher tidak ditemukan).
resources = "android_res"

[package.metadata.android.sdk]
min_sdk_version = 26
target_sdk_version = 34

[package.metadata.android.application]
label = "Hozin Kuis"
icon = "@mipmap/ic_launcher"

[package.metadata.android.application.activity]
orientation = "portrait"
exported = true
launch_mode = "singleTop"
